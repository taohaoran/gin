# Deploy Gin Architecture Docs to GitHub Pages
# 内容源优先级:
#   1) docs_archify/ 存在 → 站点内容严格等于该目录（不混入 docs/）
#   2) 不存在 → 回退部署 docs/
# 构建时 md 自动渲染为 html，并生成导览 index.html 作为站点根入口
name: Deploy Gin Architecture Docs to GitHub Pages

on:
  push:
    branches: [feat-docs-pages]
    paths:
      - 'docs/**'
      - 'docs-archify/**'
      - 'docs_archify/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # ---- 内容源选择：archify 源存在则严格按它部署，否则回退 docs ----
      - name: Build site content (archify source priority)
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site
          if [ -d "docs-archify" ] || [ -d "docs_archify" ]; then
            SRC=""
            if [ -d "docs-archify" ]; then SRC="docs-archify"; else SRC="docs_archify"; fi
            echo "==> $SRC found -> deploying its content strictly"
            cp -R "$SRC/." site/
          else
            echo "==> no archify source dir found -> deploying docs"
            cp -R docs/. site/
          fi
          # ---- md 默认转 html + 强制生成导览 index.md 并渲染为 index.html ----
          pip install --quiet markdown
          python3 scripts/build-docs-html.py site --site-name "Gin 架构文档" --group-label "architecture=架构"
          touch site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
